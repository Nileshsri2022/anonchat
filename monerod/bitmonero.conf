# Data directory (blockchain db and indices)
# Data directory (blockchain db and indices)
data-dir=/home/monero/.bitmonero

# Log file
log-file=/home/monero/.bitmonero/bitmonero.log
log-level=0

# P2P full node
p2p-bind-ip=0.0.0.0
p2p-bind-port=18080

# RPC open node
rpc-bind-ip=0.0.0.0
rpc-bind-port=18081
rpc-restricted-bind-port=18089
confirm-external-bind=1

# Slow but reliable db sync
db-sync-mode=safe

# Peer exchange
out-peers=64
in-peers=64

# Pruning (optional, saves space)
# prune-blockchain=1

# Tor / I2P (if needed directly in monerod, but we use separate containers usually)
# tx-proxy=tor,127.0.0.1:9050
