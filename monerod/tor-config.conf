# Tor Configuration for Monero Node
# Bind SOCKS proxy for Docker network access
SOCKSPort 0.0.0.0:9150

# Hidden service configuration for Monero
HiddenServiceDir /var/lib/tor/hidden_service/
HiddenServicePort 18080 monerod:18080
HiddenServicePort 18089 monerod:18089

# Circuit behavior for dynamic IPs
MaxCircuitDirtiness 600

# Logging
Log notice stdout

