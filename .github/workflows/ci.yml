# CI quality gates (ADR-0012, cleanup ticket 32): every PR is mechanically
# checked — tests, typecheck, offline production build, ESLint. The dead-code
# detector lands as an additional gate once its backlog is deleted (ticket 42).
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit & integration tests (incl. golden E2E)
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build (offline)
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
