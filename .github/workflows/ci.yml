# CI quality gates (ADR-0012, cleanup tickets 32 + 42): every PR is
# mechanically checked — tests, typecheck, offline production build, ESLint,
# and the dead-code detector as a hard gate (zero tolerance: the deletion
# backlog from tickets 33-35 must never regrow).
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit & integration tests (incl. golden E2E)
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Dead-code gate (import-graph detector)
        run: bun tools/find-dead.ts --check

      - name: Production build (offline)
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
